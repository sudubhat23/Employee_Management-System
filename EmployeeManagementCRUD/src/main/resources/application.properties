spring.application.name=EmployeeManagementCRUD

server.port=${PORT:8080}

# Default Datasource: H2 in-memory DB for zero-config portfolio testing
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
# H2 console is off by default (it exposes the database). Enable only locally with H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Secret (HS512 key - 256 bits min)
# Must be provided via environment variable. Never commit a real secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://ems-frontend-h4gf.onrender.com}
