spring.application.name=EmployeeManagementCRUD

server.port=8080

# Default Datasource: H2 in-memory DB for zero-config portfolio testing
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Secret (HS512 key - 256 bits min)
app.jwt.secret=9a2f8c4e6b1d7a3f8e5c2b9d4a7f1e6c3b8a5d2f7e4c1b9a6f3d8e5c2b9d4a7f
app.jwt.expiration-ms=86400000
