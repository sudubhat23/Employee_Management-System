# Render Blueprint specification for NexusEMS Full-Stack Application
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 17 + H2 / MySQL)
  # -------------------------------------------------------------
  - type: web
    name: ems-backend
    runtime: docker
    dockerfilePath: ./EmployeeManagementCRUD/Dockerfile
    dockerContext: ./EmployeeManagementCRUD
    plan: free
    region: oregon
    healthCheckPath: /swagger-ui.html
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xmx380m
      # Optional: To connect external MySQL (e.g. Aiven, Railway, Clever Cloud), set:
      # - key: SPRING_PROFILES_ACTIVE
      #   value: mysql
      # - key: SPRING_DATASOURCE_URL
      #   sync: false
      # - key: SPRING_DATASOURCE_USERNAME
      #   sync: false
      # - key: SPRING_DATASOURCE_PASSWORD
      #   sync: false

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite)
  # -------------------------------------------------------------
  - type: web
    name: ems-frontend
    runtime: static
    rootDir: ReactForEmployee/Employee-Management-System
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL: https://<ems-backend-name>.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
